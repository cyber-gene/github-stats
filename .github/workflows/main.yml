name: Generate Stats Images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: generate-stats
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Generate images
      run: |
        ./zig-out/bin/github-stats --overview-output-file generated/overview.svg --languages-output-file generated/languages.svg
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS || secrets.EXCLUDED }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS || secrets.EXCLUDED_LANGS }}
        EXCLUDE_PRIVATE: "false"
        EXCLUDE_FORKED_REPOS: "true"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Commit to the repo
      run: |
        git config user.name "jstrieb/github-stats"
        git config user.email "github-stats[bot]@jstrieb.github.io"
        git add generated/overview.svg generated/languages.svg
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push origin HEAD:master
